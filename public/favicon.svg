<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <rect width="64" height="64" rx="14" fill="#0b111e"/>
    <!-- Outer radar wave -->
    <circle cx="32" cy="32" r="26" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 3"/>
    <!-- Concentric wave -->
    <circle cx="32" cy="32" r="18" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Inner radar wave -->
    <circle cx="32" cy="32" r="10" stroke="#06b6d4" stroke-width="2.5"/>
    <!-- Central Network Core Node -->
    <circle cx="32" cy="32" r="5" fill="#06b6d4"/>
    <circle cx="32" cy="32" r="2" fill="#ffffff"/>
    <!-- Radar beam & satellite ping -->
    <line x1="32" y1="32" x2="52" y2="12" stroke="#00ff9d" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="52" cy="12" r="3" fill="#00ff9d"/>
    <!-- Peripheral nodes -->
    <circle cx="16" cy="24" r="2" fill="#06b6d4" fill-opacity="0.8"/>
    <circle cx="46" cy="42" r="2.5" fill="#06b6d4" fill-opacity="0.8"/>
</svg>
