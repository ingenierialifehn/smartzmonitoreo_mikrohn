services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    container_name: smartzmonitoreo_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - proyectos_default
    environment:
      - DB_HOST=servidor_db
      - DB_PORT=3306
      - DB_DATABASE=mikrohn
      - DB_USERNAME=root
      - DB_PASSWORD=root

  webserver:
    image: nginx:1.25-alpine
    container_name: smartzmonitoreo_web
    restart: unless-stopped
    ports:
      - "8668:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - proyectos_default
    depends_on:
      - app

networks:
  proyectos_default:
    external: true
